<!--
  Screen Break mark.

  A screen outline with its top-right corner deliberately missing — the break —
  and a dot resting outside the gap: the thing in the distance you are meant to
  look at. Monochrome and stroked in `currentColor` so it inherits whatever it
  is placed on, and legible down to 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"
     stroke="currentColor" stroke-width="2.1"
     stroke-linecap="round" stroke-linejoin="round" role="img"
     aria-label="Screen Break">
  <!-- The screen, open at the top right. -->
  <path d="M18 5H6a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3v-5" />
  <!-- Something in the distance. -->
  <circle cx="26.5" cy="6.5" r="2.6" fill="currentColor" stroke="none" />
</svg>
